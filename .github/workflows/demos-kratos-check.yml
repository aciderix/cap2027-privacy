name: Demos Kratos — contrôle et import de l'export

# Se connecte en FTPS au dossier d'export de demos-kratos.fr, prend le dernier
# fichier programmes et le dernier fichier match, vérifie leur cohérence
# (format, version, compteurs, références) et compare leur empreinte au
# dernier import en base (« à jour » / « à importer »).
#
# Chaque export valide et différent du dernier import est importé via la
# fonction ingest-demos-kratos (RPC dk_import : contrôle du format, puis
# remplacement complet en une transaction ; un export refusé ne change rien et
# fait échouer le run). « Run workflow » avec « à blanc » : contrôle seul.
#
# Dépôt public : le script n'affiche que noms de fichiers, dates, empreintes
# et compteurs. Les identifiants FTP restent dans les secrets.

on:
  schedule:
    - cron: "17 5 * * *" # tous les jours, vers 7 h (heure de Paris)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "À blanc : contrôler sans importer"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: demos-kratos
  cancel-in-progress: false

jobs:
  check:
    name: Check latest export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check and import
        env:
          DK_FTP_HOST: ${{ secrets.DK_FTP_HOST }}
          DK_FTP_USER: ${{ secrets.DK_FTP_USER }}
          DK_FTP_PASSWORD: ${{ secrets.DK_FTP_PASSWORD }}
          # Publics : lecture de dk_imports pour la comparaison.
          SUPABASE_URL: https://oyvqvfawcxlnvpgloicx.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_nycw__S1NdZYIVyu4LH4SQ_830IdXPA
          # Même jeton que l'ingestion RSS.
          INGEST_FROM_XML_TOKEN: ${{ secrets.INGEST_FROM_XML_TOKEN }}
          # Passage planifié : inputs.dry_run est vide, donc import.
          DK_IMPORT: ${{ inputs.dry_run && '0' || '1' }}
        run: python scripts/demos_kratos_check.py
